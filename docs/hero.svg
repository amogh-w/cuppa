    <rect x="5" y="5" width="86" height="186" rx="16" fill="#eff1f5"/>
    <rect x="12" y="16" width="72" height="10" rx="5" fill="#4c4f69" opacity=".8"/>
    <rect x="12" y="36" width="72" height="104" rx="12" fill="#e6e9ef"/>
