    <rect x="58" y="88" width="62" height="30" rx="10" fill="#313244"/><rect x="126" y="88" width="62" height="30" rx="10" fill="#313244"/>
    <rect x="58" y="126" width="130" height="34" rx="10" fill="#313244"/>
    <rect x="68" y="139" width="50" height="8" rx="4" fill="#a6adc8" opacity=".6"/><rect x="150" y="136" width="28" height="14" rx="7" fill="#b4befe"/><circle cx="171" cy="143" r="5" fill="#1e1e2e"/>
