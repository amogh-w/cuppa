<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 360" role="img" aria-label="cuppa: one look and one set of shared code for every app">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#1e1e2e"/><stop offset="1" stop-color="#11111b"/></linearGradient>
    <linearGradient id="cup" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#cdd6f4"/><stop offset=".35" stop-color="#b4befe"/><stop offset="1" stop-color="#cba6f7"/></linearGradient>
    <linearGradient id="pad" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#b4befe"/><stop offset="1" stop-color="#cba6f7"/></linearGradient>
    <radialGradient id="glow" cx=".5" cy=".5" r=".5"><stop offset="0" stop-color="#b4befe" stop-opacity=".35"/><stop offset="1" stop-color="#b4befe" stop-opacity="0"/></radialGradient>
    <clipPath id="clip"><rect width="1200" height="360" rx="28"/></clipPath>
  </defs>
  <style>text{font-family:system-ui,"Segoe UI",Helvetica,Arial,sans-serif}</style>

  <g clip-path="url(#clip)">
    <rect width="1200" height="360" fill="url(#bg)"/>
    <circle cx="190" cy="190" r="190" fill="url(#glow)"/>
    <circle cx="1060" cy="40" r="240" fill="#cba6f7" opacity=".06"/>
    <circle cx="640" cy="420" r="200" fill="#89b4fa" opacity=".05"/>
  </g>

  <!-- cup -->
  <g transform="translate(70 62)">
