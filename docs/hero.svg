    <rect x="3" y="3" width="194" height="166" rx="11" fill="#1e1e2e"/>
    <rect x="3" y="3" width="194" height="24" rx="11" fill="#181825"/><rect x="3" y="16" width="194" height="11" fill="#181825"/>
