      <path d="M70 52 c-16 -14 16 -24 0 -42"/><path d="M118 52 c-16 -14 16 -24 0 -42"/><path d="M166 52 c-16 -14 16 -24 0 -42"/>
    </g>
    <path d="M205 118 h24 a38 38 0 0 1 0 76 h-34" fill="none" stroke="#b4befe" stroke-width="16" stroke-linecap="round"/>
    <path d="M24 84 h186 v66 a93 93 0 0 1 -93 93 a93 93 0 0 1 -93 -93z" fill="url(#cup)"/>
    <ellipse cx="117" cy="84" rx="93" ry="9" fill="#e6e9ff" opacity=".55"/>
    <ellipse cx="117" cy="256" rx="112" ry="10" fill="#45475a"/>
    <ellipse cx="117" cy="252" rx="112" ry="10" fill="#585b70"/>
  </g>

  <!-- wordmark -->
  <text x="360" y="176" font-size="104" font-weight="800" fill="#cdd6f4" letter-spacing="-2">cuppa</text>
  <text x="364" y="222" font-size="22" fill="#a6adc8">One look and shared code for every app.</text>
  <g font-size="19" font-weight="600">
    <rect x="364" y="252" width="158" height="42" rx="21" fill="#313244"/><circle cx="388" cy="273" r="6" fill="#b4befe"/><text x="404" y="279" fill="#cdd6f4">cuppa-ui kit</text>
    <rect x="534" y="252" width="132" height="42" rx="21" fill="#313244"/><circle cx="558" cy="273" r="6" fill="#cba6f7"/><text x="574" y="279" fill="#cdd6f4">harness</text>
    <rect x="678" y="252" width="150" height="42" rx="21" fill="#313244"/><circle cx="702" cy="273" r="6" fill="#89b4fa"/><text x="718" y="279" fill="#cdd6f4">shared code</text>
  </g>

